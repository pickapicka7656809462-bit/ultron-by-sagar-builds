name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Setup Capacitor
        run: |
          npm install
          mkdir -p out
          echo '<html><body><h1>Ultron App</h1></body></html>' > out/index.html
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Ultron com.ultron.app --web-dir out --no-interaction
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-build-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ultron-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
