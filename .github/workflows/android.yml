name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Force Static Export & Add Capacitor
        run: |
          npx next build || true
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Ultron com.ultron.app --web-dir out || npx cap init Ultron com.ultron.app --web-dir public
          npx cap add android || true
          npx cap copy

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ultron-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
